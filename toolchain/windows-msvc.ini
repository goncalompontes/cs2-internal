# Meson cross file: x86_64-pc-windows-msvc via clang-cl + lld.
#
# Source toolchain/msvc/msvcenv-native.sh first so INCLUDE/LIB point at the
# MSVC + WinSDK headers and libs, e.g.:
#   BIN=toolchain/msvc/bin/x64 . toolchain/msvc/msvcenv-native.sh
#
# Then:
#   meson setup build-payload payload --cross-file toolchain/windows-msvc.ini

[binaries]
c = 'clang-cl'
cpp = 'clang-cl'
ar = 'llvm-ar'
strip = 'llvm-strip'
windres = 'llvm-rc'

[host_machine]
system = 'windows'
subsystem = 'windows'
kernel = 'nt'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'

[built-in options]
# The **dynamic** CRT (`/MD`) is the injected configuration. Measured live
# 2026-10-22: a `/MT` payload carries a TLS directory (the static CRT's
# `_tls_index`/TSS guards), and the manual map's entry thread faults before
# `DllMain` returns; the `/MD` image has no TLS directory and boots. The
# injector's `--load-missing` resolves MSVCP140/VCRUNTIME140/ucrt.
b_vscrt = 'md'
