# Meson cross file: x86_64-pc-windows-msvc via clang-cl + lld.
#
# Source toolchain/msvc/msvcenv-native.sh first so INCLUDE/LIB point at the
# MSVC + WinSDK headers and libs, e.g.:
#   BIN=toolchain/msvc/bin/x64 . toolchain/msvc/msvcenv-native.sh
#
# Then:
#   meson setup build-payload payload --cross-file toolchain/windows-msvc.ini

[binaries]
c = 'clang-cl'
cpp = 'clang-cl'
ar = 'llvm-ar'
strip = 'llvm-strip'
windres = 'llvm-rc'

[host_machine]
system = 'windows'
subsystem = 'windows'
kernel = 'nt'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'

[built-in options]
# Static CRT is the safest default for a payload module.
cpp_args = ['-D_MT', '-fms-extensions', '-fms-compatibility']
c_args = ['-D_MT', '-fms-extensions', '-fms-compatibility']
