# The project's continuous integration.
#
# It runs the verify loop that docs/style-guide.md §7 and the handoff notes
# prescribe, on a Windows runner:
#
#   * the host build (meson) and the host test suite,
#   * the Windows payload, overlay and injector builds (clang-cl),
#   * the Python suite (the scenario harness),
#   * the type gate (mypy),
#   * the style gate (the clang-tidy sweep's check mode).
#
# WHAT IT DOES NOT COVER (deliberately -- see docs/quality-pass.md):
#   * the live game: a CI runner has no GPU and no interactive session, so
#     nothing here exercises the payload in CS2. The live checks stay manual
#     (docs/windows-validation.md).
#   * the protection pass: `-Dprotect=true` needs the LLVM pass plugin and a
#     policy file, which are not in the tree.
#   * the Vulkan layer's runtime behaviour: the layer is only compiled here.
#   * the injector against a real target: the injector's own test aids
#     (a benign victim, a trivial DLL) are built, not run against a target.
#   * the format check: the tree is deliberately not clang-format-clean
#     (docs/style-guide.md §7 rule 3), so a format check would be red on
#     its first run. The style gate -- the sweep's check mode over the
#     groups the tree is clean under -- is the check that exists.
#
# WHAT THE PAYLOAD STEP ACTUALLY BUILDS: the payload with an **empty SDK**.
# The SDK headers (payload/sdk/*.hpp) are generated from the calibration
# dumps, and the dumps are git-ignored (they come from a live calibration
# against a running game), so on a fresh runner -- and on a fresh checkout
# -- the generator writes *empty* headers and the payload is built with zero
# offsets. The CI's payload.dll is therefore a *compile* of the payload, not
# the shipped artifact: the shipped one is built after a calibration
# (docs/windows-validation.md). The headers the payload step compiles
# against are the ones the host build generates, which is why the host build
# runs first.
#
# The compiler is clang-cl -- the compiler the payload is built with -- and it
# is the configuration this repository is verified with locally.

name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: build and test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # The MSVC environment: the toolchain (the CRT, the Windows SDK) and
      # `lib.exe` come from it, and clang-cl needs its include and lib paths.
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: the build tools
        run: |
          python -m pip install --upgrade pip
          # The pinned build system (meson, ninja) and the pinned gate tools
          # (mypy, clang-tidy). The file's own rule: "a gate that changes its
          # mind between runs is not a gate".
          python -m pip install -r requirements-dev.txt

      - name: the compiler (clang-cl) and the LLVM tools
        run: |
          "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          "CC=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CXX=clang-cl" | Out-File -FilePath $env:GITHUB_ENV -Append

      # The SDK headers are generated by the Rust dumper: scripts/gen-sdk.py
      # builds it with cargo when the binary is not in the tree. Every build
      # of the host project therefore needs a Rust toolchain, which the
      # runner image ships. This step says so out loud: without it, the
      # build fails deep inside a build step with "cargo not found".
      - name: the Rust toolchain (the SDK generator)
        run: |
          if (-not (Get-Command cargo -ErrorAction SilentlyContinue)) {
            throw "cargo is required: the SDK headers are generated by the Rust dumper (scripts/gen-sdk.py)"
          }
          cargo --version

      - name: the host build (configure)
        run: meson setup build .

      - name: the host build (compile)
        run: meson compile -C build

      - name: the host tests
        run: meson test -C build

      # The payload is **manually mapped** into the game and deliberately
      # avoids the CRT (ADR-0010), so it must be linked against the *static*
      # CRT: the cross file is what pins `b_vscrt = 'mt'`. Without it meson
      # picks `md`, and the DLL then imports MSVCP140.dll / VCRUNTIME140.dll /
      # ucrtbase.dll, which the injector's manual loader would have to
      # resolve inside cs2.exe -- an artifact nobody has run in the game.
      # The cross file is the documented configuration (docs/architecture.md).
      - name: the payload build (configure)
        run: meson setup build-payload payload --cross-file toolchain/windows-msvc.ini

      - name: the payload build (compile)
        run: meson compile -C build-payload

      # The Vulkan headers are **git-ignored** (a large, non-redistributable
      # download -- see .gitignore and docs/setup-windows.md §5), so
      # `actions/checkout` cannot fetch them: the overlay's
      # `include_directories('../external/Vulkan-Headers/include')` fails at
      # *configure* time without them, and the whole job is red. The runner
      # clones them here, exactly as docs/setup-windows.md §5 says a
      # developer does. The tag is pinned: the gate must build the same
      # headers every run.
      - name: the Vulkan headers
        run: |
          git clone --depth 1 --branch vulkan-sdk-1.4.363.0 `
            https://github.com/KhronosGroup/Vulkan-Headers external/Vulkan-Headers

      - name: the overlay build (configure)
        run: meson setup build-overlay overlay

      - name: the overlay build (compile)
        run: meson compile -C build-overlay

      - name: the injector build (configure)
        run: meson setup build-injector injector

      - name: the injector build (compile)
        run: meson compile -C build-injector

      - name: the Python suite
        run: python -m unittest discover -s scripts/scenario/tests -t scripts

      - name: the type gate
        run: python scripts/typecheck.py

      # The style gate runs the **pinned** clang-tidy (the LLVM release the
      # gated groups were baselined with). The runner ships its own LLVM, so
      # the pinned binary is put first on PATH: otherwise the gate would
      # silently run a different version and its verdict would mean nothing.
      - name: the style gate
        run: |
          $pinned = python -c "import clang_tidy, os; print(os.path.join(os.path.dirname(clang_tidy.__file__), 'data', 'bin'))"
          $env:PATH = "$pinned;$env:PATH"
          clang-tidy --version
          python scripts/clang-tidy-fix.py --check
